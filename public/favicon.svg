<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Church of the Blessed Sacrament — folded blue tent roof mark">
  <!-- Round-19 favicon (audit R2-F7): purpose-drawn sapphire/gold mark replacing
       the platform-dependent ⛪ emoji glyph. Sapphire field = bsc-sapphire-950
       #0a1122; the gold folded-roof planes = bsc-gold-400 #d4ad42 with a
       gold-200 #ebd599 lit facet, referencing the Dowsett tent-shaped roof. -->
  <rect width="100" height="100" rx="14" fill="#0a1122"/>
  <!-- roof planes: two slopes meeting at the ridge (the tent silhouette) -->
  <path d="M14 66 L50 26 L86 66 L74 66 L50 40 L26 66 Z" fill="#d4ad42"/>
  <!-- lit facet: the sunward fold of the roof -->
  <path d="M50 26 L50 40 L62 53 L56 60 L74 66 Z" fill="#ebd599" opacity="0.85"/>
  <!-- ground line: the parish at 1 Commonwealth Drive -->
  <rect x="22" y="70" width="56" height="4" rx="2" fill="#d4ad42"/>
</svg>
